name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional extra jasmine spec filter'
        required: false
        default: ''

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        # Upstream ran ['lts/*', 'node'], i.e. Node 14 and Node 16 at the 2.0.6
        # release date; pinned to those exact majors so the fork is reproducible.
        # Node 8 (the package.json `engines` floor) cannot be used: jasmine 3.7's
        # lib/loader.js uses dynamic import(), unparsable before Node 12.17.
        node_version: ['16', '14']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: npm run test:unit ${{ inputs.test-filter }}
      - name: Run Spec Tests 👩🏽‍💻
        run: npm run test:specs ${{ inputs.test-filter }}
      - name: Pack 📦
        if: matrix.node_version == '16'
        run: npm pack
      - name: Upload package tarball
        if: matrix.node_version == '16'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: marked-*.tgz
          if-no-files-found: error

  Lint:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm ci
      - name: Lint ✨
        run: npm run test:lint

  Release:
    needs: [Test, Lint]
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: |
          npm run build
          if ! git diff --quiet; then
            git config --global user.email "<>"
            git config --global user.name "MarkedJS bot"
            git commit -am "🗜️ build [skip ci]"
          fi
      - name: Release 🎉
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  Skip:
    if: contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip CI 🚫
        run: echo skip ci
